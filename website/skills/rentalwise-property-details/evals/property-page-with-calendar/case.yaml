schema_version: "1.1"
name: property-page-with-calendar
expected_outcome: |
  Loads the property via property/query by seo.slug with an explicit with list covering images, amenities.amenity_group, rooms.beds.bed_type, policies, rates_settings, fees.fee_type, reviews and rental_agreement; calls property/get-unavailability with a daterange and converts blocks into available/unavailable ranges; uses display_geo (not geo) for the map; resolves TranslatedText for the locale; does not cache availability with the property.
